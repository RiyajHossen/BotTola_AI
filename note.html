<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Video Gallery</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* =====================
   Global Styles
===================== */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: #0f172a;
    color: #e5e7eb;
    padding: 30px;
}

h1 {
    text-align: center;
    margin-bottom: 25px;
    font-size: 32px;
}

/* =====================
   Video Grid
===================== */
.video-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 18px;
}

.video-card {
    position: relative;
    cursor: pointer;
    background: #020617;
    border-radius: 12px;
    overflow: hidden;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
}

.video-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}

.video-card video {
    width: 100%;
    height: 160px;
    object-fit: cover;
    display: block;
}

.video-title {
    padding: 10px;
    font-size: 14px;
    text-align: center;
    background: #020617;
}

/* Play Icon */
.play-icon {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    color: rgba(255,255,255,0.85);
    background: rgba(0,0,0,0.25);
    opacity: 0;
    transition: opacity 0.2s ease;
}

.video-card:hover .play-icon {
    opacity: 1;
}

/* =====================
   Modal Player
===================== */
.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
}

.modal.active {
    display: flex;
}

.modal-content {
    position: relative;
    width: 90%;
    max-width: 900px;
    background: #020617;
    border-radius: 14px;
    padding: 15px;
}

.modal video {
    width: 100%;
    max-height: 70vh;
    border-radius: 10px;
    background: black;
}

/* Close Button */
.close-btn {
    position: absolute;
    top: -14px;
    right: -14px;
    background: #ef4444;
    color: white;
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
}

/* Responsive tweak */
@media (max-width: 600px) {
    .video-card video {
        height: 140px;
    }
}
</style>
</head>

<body>

<h1>AI Video Gallery</h1>

<div class="video-grid" id="videoGrid">
    <!-- 12+ Video Cards -->
</div>

<!-- Modal -->
<div class="modal" id="videoModal">
    <div class="modal-content">
        <button class="close-btn" id="closeModal">×</button>
        <video id="modalVideo" controls autoplay></video>
    </div>
</div>

<script>
/* =====================
   Video Data
   Replace URLs with your AI videos
===================== */
const videos = [
    { title: "AI Cinematic City", src: "https://www.pexels.com/download/video/18069236/" },
    { title: "AI Cinematic City", src: "https://www.pexels.com/download/video/28615171/" },
    { title: "AI Cinematic City", src: "https://www.pexels.com/download/video/29873144/" },
    { title: "AI Cinematic City", src: "https://www.pexels.com/download/video/9790215/" },
    { title: "AI Cinematic City", src: "https://www.pexels.com/download/video/8369957/" },
    { title: "AI Cinematic City", src: "https://www.pexels.com/download/video/34996611/" },
    { title: "AI Cinematic City", src: "https://www.pexels.com/download/video/8087088/" },    
    { title: "AI Cinematic City", src: "https://www.pexels.com/download/video/18069236/" },
    { title: "AI Cinematic City", src: "https://www.pexels.com/download/video/28615171/" },
    { title: "AI Cinematic City", src: "https://www.pexels.com/download/video/29873144/" },
    { title: "AI Cinematic City", src: "https://www.pexels.com/download/video/9790215/" },
    { title: "AI Cinematic City", src: "https://www.pexels.com/download/video/8369957/" },
    { title: "AI Cinematic City", src: "https://www.pexels.com/download/video/34996611/" },
    { title: "AI Cinematic City", src: "https://www.pexels.com/download/video/8087088/" },    
];

/* =====================
   Render Gallery
===================== */
const grid = document.getElementById("videoGrid");
const modal = document.getElementById("videoModal");
const modalVideo = document.getElementById("modalVideo");
const closeModal = document.getElementById("closeModal");

videos.forEach(video => {
    const card = document.createElement("div");
    card.className = "video-card";

    card.innerHTML = `
        <video src="${video.src}" muted></video>
    `;

    card.addEventListener("click", () => {
        modalVideo.src = video.src;
        modal.classList.add("active");
        modalVideo.play();
    });

    grid.appendChild(card);
});

/* =====================
   Modal Close Logic
===================== */
closeModal.addEventListener("click", closePlayer);
modal.addEventListener("click", e => {
    if (e.target === modal) closePlayer();
});

function closePlayer() {
    modal.classList.remove("active");
    modalVideo.pause();
    modalVideo.src = "";
}
</script>

</body>
</html>
