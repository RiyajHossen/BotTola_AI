<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AI Video Generator - Mockup</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    
<style>
:root{
  --bg:#141414;          /* container background */
  --border:#222;         /* subtle border */
  --text:#e6e6e6;        /* label color */
  --muted:#9aa0a6;       /* muted (if needed) */
  --green:#2db14a;       /* badge green */
}

body {
  background:#0f0f0f;
  font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
  padding:24px;
}
.custom-select, 
/* Target the dropdown listbox itself */
::picker(select.custom-select) {
  /* This property enables rich customization */
  appearance: base-select; 
  background-color: #2c2c2c; /* Dark background */
  color: #fff; /* White text */
  border: 1px solid #444; 
  border-radius: 8px; /* Rounded corners */
  padding: 10px 15px; 
  font-family: sans-serif;
  width: 250px;
  cursor: pointer;
}

/* Style the button that is the visible, closed select input */
.custom-select > button {
  display: flex;
  align-items: center;
  justify-content: space-between; /* Pushes content and arrow apart */
  width: 100%;
  border: none;
  background: none;
  color: inherit;
  padding: 0;
}

/* Style the placeholder where selected option's content goes */
selectedcontent {
  display: flex;
  align-items: center;
  gap: 10px; /* Space between label and badge */
}

/* Style the options within the open dropdown picker */
::picker(select.custom-select) option {
  display: flex;
  justify-content: space-between;
  padding: 8px 15px;
  /* Add hover styles here for options */
}

/* Hide the default OS arrow icon and add a custom one */
::picker-icon(select.custom-select) {
  appearance: none; /* Hide default arrow */
  /* Add custom SVG background or CSS arrow here */
}

/* Style the badge element */
.badge {
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 0.75em;
  font-weight: bold;
}

.badge.new {
  background-color: #4CAF50; /* Green color for 'NEW' */
  color: #fff;
}
</style>
</head>
<body>
  <select class="custom-select">
  <!-- This button acts as the closed select box UI -->
  <button>
    <selectedcontent></selectedcontent>
  </button>
  
  <option value="item1">
    <span>Image 2.1</span>
    <span class="badge new">NEW</span>
  </option>
  <option value="item2">
    <span>Image 2.2</span>
    <span class="badge">OLD</span>
  </option>
</select>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
